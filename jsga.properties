# =====================================
#
# === Genetic Algorithm Parameters ====
#
# =====================================

# Number of individuals in the population
population.size=10

# Number of bits per individual
gene.length=20

# selection:
selection.parameter=1.0
selection.type=sus
# selection.type="tournament"
# selection.type="roulette"
# selection.type="rank"

# Probability of crossover
crossover.rate=0.987

# Crossover type:
# crossover.type=onepoint
# crossover.type=twopoint
# crossover.type=uniform

# Probability of mutation per gene
mutation.rate=0.05

# AdaptiveBitFlipPopulationMutation type:
# mutation.type=bitflip
mutation.type=swap
# mutation.type=gaussian

# Maximum number of generations
max.generations=50

# Preserve best individual each generation
elitism.enabled=true

# === Problem Configuration ===
problem=org.example.jsga.problem.MaxOnesProblem

# =======================================
#
# === Diversity Preservation Options ====
#
# =======================================

# Enable or disable diversity techniques
diversity.enabled=false

# Strategy type (e.g., random_immigrants, crowding, fitness_sharing)
# 1) random_immigrants
# 2) crowding
# 3) fitness_sharing
# 4) island_model
# 5) mutation
# diversity.strategy=random_immigrants
# diversity.strategy=crowding
diversity.strategy=fitness_sharing
# diversity.strategy=island_model

# Number of random individuals injected per generation
random_immigrants.count=2

# =========================================
#
# === Optional Future Strategy Toggles ====
#
# =========================================

# Enable crowding replacement mechanism
crowding.similarity.threshold=0.3

# Enable fitness sharing to preserve niches
fitness_sharing.niche_radius=3.0

# Enable island model GA structure
island.count=4
island.migration.interval=5
island.migration.size=2

# Enable adaptive mutation rate
mutation.adaptive=true

# Enable convergence
convergence.enabled=false
# convergence.threshold=0.1
# convergence.few.threshold=10
# convergence.maxconv=7
# convergence.sigma.enabled=true
# convergence.sigma.factor=0.3
# convergence.bias,enabled=true
# convergence.maxbias=1.0
# convergence.min_generations=5

termination.done.enabled=true
termination.convergence.enabled=false