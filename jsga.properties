# =====================================
#
# === Genetic Algorithm Parameters ====
#
# =====================================

# Number of individuals in the population
population.size=10

# Number of bits per individual
gene.length=20

# Seed for reproducible population initialization and genetic operators
seed=123456789

# Population initialization: random or manual
initialization.type=random
# For manual initialization, provide comma-separated bit strings matching gene.length
# initialization.type=manual
# initialization.genes=10101010101010101010,01010101010101010101

# selection:
selection.parameter=1.0
selection.type=sus
# selection.type="tournament"
# selection.type="roulette"
# selection.type="rank"

# Probability of crossover
crossover.rate=0.987

# Fraction of the population replaced by selected offspring each generation
gap.size=1.0

# Crossover type: onepoint, twopoint, or uniform
# crossover.type=onepoint
# crossover.type=twopoint
# crossover.type=uniform

# Mutation probability: per bit for bitflip, adaptivebitflip, and gaussian;
# per individual for swap
mutation.rate=0.05

# Mutation type: bitflip, adaptivebitflip, swap, or gaussian
mutation.type=swap

# Maximum number of generations
max.generations=50

# Preserve best individual each generation
elitism.enabled=true

# === Problem Configuration ===
problem=com.rafaelgpq.jsga.problem.MaxOnesProblem

# Parameterized objectives can enable Dynamic Parameter Encoding (DPE).
# problem=com.rafaelgpq.jsga.problem.SphereProblem
dpe.enabled=false
# dpe.positions=10,20,30
# dpe.factors=0.01,0.01,0.01
# dpe.bases=-5.12,-5.12,-5.12
dpe.frequency=10
dpe.few.threshold=2
dpe.gray=false
dpe.log=dpe.log

# Optional population checkpoints and restart.
checkpoint.enabled=false
# checkpoint.file=jsga.checkpoint
checkpoint.interval=1
restart.enabled=false
# restart.file=jsga.checkpoint

# Optional per-generation performance report (GAucsd report.c/measure.c parity).
# Each row is: Gen Trials Lost Conv Bias Online Offline Best Average,
# and can be summarized with com.rafaelgpq.jsga.report.ReportGenerator.
report.enabled=false
# report.file=ga_output.txt
report.interval=1

# =======================================
#
# === Diversity Preservation Options ====
#
# =======================================

# Enable or disable diversity techniques
diversity.enabled=false

# Strategy type (e.g., random_immigrants, crowding, fitness_sharing)
# 1) random_immigrants
# 2) crowding
# 3) fitness_sharing
# 4) island_model
# 5) mutation
# diversity.strategy=random_immigrants
# diversity.strategy=crowding
diversity.strategy=fitness_sharing
# diversity.strategy=island_model

# Number of random individuals injected per generation
random_immigrants.count=2

# =========================================
#
# === Optional Future Strategy Toggles ====
#
# =========================================

# Enable crowding replacement mechanism
crowding.similarity.threshold=0.3

# Enable fitness sharing to preserve niches
fitness_sharing.niche_radius=3.0

# Optional schema tracking writes results to schema.file.analysis by default
schema.enabled=false
# schema.file=path/to/schema.txt
# schema.worst_fitness=0.0
# schema.output=path/to/schema-results.txt

# Enable island model GA structure
island.count=4
island.migration.interval=5
island.migration.size=2

# Enable rate adaptation when mutation.type=adaptivebitflip
mutation.adaptive=true

# Enable convergence
convergence.enabled=false
# convergence.threshold=0.1
# convergence.few.threshold=10
# convergence.maxconv=7
# sigma.factor=0.3
# maxbias=1.0
# convergence.min_generations=5

# Optional early-stop checks; max.generations is always the hard generation cap.
termination.done.enabled=true
termination.trial_limit=0
termination.stagnation.generations=0
